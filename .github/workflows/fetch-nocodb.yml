name: Fetch NocoDB Data and Update Site

on:
  # Trigger on pushes to the main branch (adjust branch name if needed)
  push:
    branches:
      - main # Or master, production, etc.
  # Trigger manually from the Actions tab
  workflow_dispatch:
  # Trigger on a schedule (every day at midnight UTC)
  schedule:
    - cron: '0 0 * * *'

jobs:
  fetch_and_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Setup your scripting environment (Choose ONE - Node.js or Python) ---

      # Option 1: Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Or your preferred Node.js version
          cache: 'npm'
      - name: Create package.json if needed
        run: |
          if [ ! -f package.json ]; then
            echo '{"name":"biodesign-jobs","version":"1.0.0","private":true,"dependencies":{}}' > package.json
          fi
      
      - name: Install required dependencies
        run: npm install axios js-yaml

      # Option 2: Setup Python
      # - name: Set up Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.11' # Or your preferred Python version
      # - name: Install Python dependencies
      #   run: |
      #     python -m pip install --upgrade pip
      #     # Ensure you have a requirements.txt listing libraries like 'requests'
      #     if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # --- Run the fetch script ---
      - name: Fetch data from NocoDB API
        run: node ./scripts/fetch-data.js
        env:
          NOCODB_APIKEY: ${{ secrets.NOCODB_APIKEY }}
          NOCODB_URL: 'https://app.nocodb.com/api/v2/tables/m0npw5ezr4q4rfv/records?offset=0&limit=25&where=&viewId=vws6w9ju2dz3fcmh'

      # --- Commit and push job changes ---
      - name: Commit job files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # Stage changes in the content/jobs directory
          git add content/jobs/
          # Check if there are changes to commit
          if git diff --staged --quiet content/jobs/; then
            echo "No job changes to commit."
          else
            git commit -m "chore: Update job listings from NocoDB [skip ci]"
            echo "Job listing changes committed."
          fi
      - name: Push changes
        # This action pushes changes back to the repo, triggering Cloudflare Pages
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
